services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slai
      POSTGRES_USER: slai
      POSTGRES_PASSWORD: slai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slai -d slai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://slai:slai@postgres:5432/slai?sslmode=disable
      MIGRATIONS_DIR: /app/db/migrations
      LOG_LEVEL: info
      SESSION_SECRET: dev-only-change-me
      COOKIE_SECURE: "false"
      SESSION_TTL: 168h
      OMNIROUTE_ENABLED: "false"
      OMNIROUTE_BASE_URL: http://omniroute:4000
      OMNIROUTE_MANAGEMENT_TOKEN: ""
      OMNIROUTE_USAGE_SYNC_MODE: call_logs
    command: ["/app/slai-api", "migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://slai:slai@postgres:5432/slai?sslmode=disable
      MIGRATIONS_DIR: /app/db/migrations
      LOG_LEVEL: info
      SESSION_SECRET: dev-only-change-me
      COOKIE_SECURE: "false"
      SESSION_TTL: 168h
      ADMIN_SEED_EMAIL: admin@example.com
      ADMIN_SEED_PASSWORD: change-me-admin-password
      READINESS_TIMEOUT: 2s
      SHUTDOWN_TIMEOUT: 10s
      OMNIROUTE_ENABLED: "false"
      OMNIROUTE_BASE_URL: http://omniroute:4000
      OMNIROUTE_MANAGEMENT_TOKEN: ""
      OMNIROUTE_USAGE_SYNC_MODE: call_logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep OK"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
